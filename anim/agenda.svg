="362" width="169" height="46" rx="8" fill="#fff" filter="url(#sombra)"/><text x="82" y="382" font-size="12" fill="#111b21" font-weight="700">✅ ¡Cita agendada!</text><text x="82" y="399" font-size="11" fill="#3b4a54">Jueves 12 · 10:30 a. m.</text></g><rect x="376" y="98" width="430" height="200" rx="10" fill="#2a1c0f"/><rect x="370" y="92" width="430" height="200" rx="10" fill="#fff" stroke="#2a1c0f" stroke-width="3"/><text x="388" y="120" font-size="13" font-weight="700" fill="#3c4043">📅 Google Calendar · jueves 12</text><path d="M372 132h426" stroke="#e0e0e0"/><text x="388" y="158" font-size="10.5" fill="#70757a">9:00</text><path d="M432 154h350" stroke="#eeeeee"/><text x="388" y="194" font-size="10.5" fill="#70757a">10:00</text><path d="M432 190h350" stroke="#eeeeee"/><text x="388" y="230" font-size="10.5" fill="#70757a">11:00</text><path d="M432 226h350" stroke="#eeeeee"/><text x="388" y="266" font-size="10.5" fill="#70757a">12:00</text><path d="M432 262h350" stroke="#eeeeee"/><rect x="440" y="162" width="140" height="24" rx="5" fill="#bcc8d6"/><text x="450" y="178" font-size="10.5" fill="#3c4043">Ocupado (encargado)</text><g class="ev"><rect x="440" y="208" width="230" height="36" rx="5" fill="#039be5"/><text x="450" y="224" font-size="11" font-weight="700" fill="#fff">Servicio completo · Ana</text><text x="450" y="238" font-size="10" fill="#e3f2fd">10:30 – 11:30 · agendada por el bot</text></g><g class="av1"><rect x="376" y="318" width="430" height="46" rx="10" fill="#2a1c0f"/><rect x="370" y="312" width="430" height="46" rx="10" fill="#fff" stroke="#2a1c0f" stroke-width="3"/><text x="386" y="332" font-size="11.5" font-weight="700" fill="#0f766e">Aviso al encargado</text><text x="386" y="348" font-size="11.5" fill="#3b4a54">🆕 Nueva cita: Ana · Servicio completo · jueves 10:30</text></g><g class="av2"><rect x="376" y="378" width="430" height="46" rx="10" fill="#2a1c0f"/><rect x="370" y="372" width="430" height="46" rx="10" fill="#fff7d6" stroke="#2a1c0f" stroke